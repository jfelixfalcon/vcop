apiVersion: v1
kind: ConfigMap
metadata:
  name: vcop-appstore-catalog
  namespace: vcop-system
  labels:
    app.kubernetes.io/name: vc-operations-center
    app.kubernetes.io/part-of: vcop
    vcop.dev/component: appstore-catalog
data:
  catalog.json: |
    {
      "updatedAt": "2026-09-08T00:00:00.000Z",
      "groups": [
        {
          "id": "essential-ingress",
          "name": "Core Ingress & TLS",
          "description": "Automated TLS certificate issuing and layer-7 ingress routing stack",
          "icon": "Network",
          "appIds": ["cert-manager", "ingress-nginx"]
        },
        {
          "id": "observability-suite",
          "name": "Observability & Metrics",
          "description": "Prometheus monitoring and telemetry suite for virtual clusters",
          "icon": "Activity",
          "appIds": ["prometheus"]
        },
        {
          "id": "data-services",
          "name": "Data & Caching",
          "description": "High-throughput Redis cache for containerized microservices",
          "icon": "Database",
          "appIds": ["redis"]
        }
      ],
      "apps": [
        {
          "id": "cert-manager",
          "name": "Cert-Manager",
          "description": "Automated TLS / SSL certificate management with Let's Encrypt and private PKI",
          "category": "Security & Auth",
          "version": "v1.16.2",
          "icon": "Shield",
          "tags": ["tls", "certificates", "security", "pki"],
          "helm": {
            "repo": "https://charts.jetstack.io",
            "name": "cert-manager",
            "releaseName": "cert-manager",
            "version": "v1.16.2",
            "namespace": "cert-manager",
            "values": "installCRDs: true\nreplicaCount: 1\n"
          }
        },
        {
          "id": "ingress-nginx",
          "name": "NGINX Ingress Controller",
          "description": "Enterprise HTTP/HTTPS Ingress controller with automated routing and SSL termination",
          "category": "Network & Ingress",
          "version": "4.12.0",
          "icon": "Network",
          "tags": ["ingress", "nginx", "routing", "http"],
          "helm": {
            "repo": "https://kubernetes.github.io/ingress-nginx",
            "name": "ingress-nginx",
            "releaseName": "ingress-nginx",
            "version": "4.12.0",
            "namespace": "ingress-nginx",
            "values": "controller:\n  service:\n    type: NodePort\n"
          }
        },
        {
          "id": "prometheus",
          "name": "Prometheus Monitoring",
          "description": "System monitoring and alerting toolkit with real-time metrics scraping and storage",
          "category": "Observability",
          "version": "25.27.0",
          "icon": "Activity",
          "tags": ["monitoring", "prometheus", "metrics", "alerts"],
          "helm": {
            "repo": "https://prometheus-community.github.io/helm-charts",
            "name": "prometheus",
            "releaseName": "prometheus",
            "version": "25.27.0",
            "namespace": "monitoring",
            "values": "server:\n  retention: 7d\n  persistentVolume:\n    size: 10Gi\n"
          }
        },
        {
          "id": "redis",
          "name": "Redis In-Memory Data Store",
          "description": "In-memory key-value cache and message broker for high-speed application caching",
          "category": "Storage & Database",
          "version": "19.6.4",
          "icon": "Database",
          "tags": ["redis", "database", "cache", "key-value"],
          "helm": {
            "repo": "https://charts.bitnami.com/bitnami",
            "name": "redis",
            "releaseName": "redis",
            "version": "19.6.4",
            "namespace": "data",
            "values": "architecture: standalone\nauth:\n  enabled: false\n"
          }
        }
      ]
    }
