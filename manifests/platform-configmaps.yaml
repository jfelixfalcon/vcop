        }
      ],
      "vclusterVersions": [
        {
          "version": "0.36.0",
          "label": "0.36.0 (Recommended Core)",
          "tag": "default",
          "isDefault": true,
          "notes": "High performance syncer engine with ambient service routing"
        },
        {
          "version": "0.35.2",
          "label": "0.35.2 (Previous Stable)",
          "tag": "lts",
          "isDefault": false,
          "notes": "Proven stable syncer release for enterprise clusters"
        }
      ],
      "etcdVersions": [
        {
          "version": "3.6.8-0",
          "label": "3.6.8-0 (Production SSD)",
          "tag": "default",
          "isDefault": true,
          "notes": "High throughput key-value backing store for state persistence"
        },
        {
          "version": "3.5.15-0",
          "label": "3.5.15-0 (Long-Term Stable)",
          "tag": "lts",
          "isDefault": false,
          "notes": "etcd 3.5 LTS release for standard workloads"
        }
