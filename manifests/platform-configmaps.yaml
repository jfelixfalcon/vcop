# ==============================================================================
# Virtual Cluster Operations Center (VCOP) - Platform ConfigMaps
# ==============================================================================
# Direct Kubernetes manifests for automated GitOps / kubectl deployment.
# Apply to host cluster:
#   kubectl apply -f manifests/platform-configmaps.yaml
# ==============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: vcop-version-registry
  namespace: vcop-system
  labels:
    app.kubernetes.io/name: vc-operations-center
    app.kubernetes.io/part-of: vcop
    vcop.dev/component: version-registry
data:
  versions.json: |
    {
      "updatedAt": "2026-09-08T00:00:00.000Z",
      "imagePatterns": {
        "k8s": "registry.k8s.io/kube-apiserver:<tag>",
        "vcluster": "ghcr.io/loft-sh/vcluster:<tag>",
        "etcd": "registry.k8s.io/etcd:<tag>",
        "coredns": "registry.k8s.io/coredns/coredns:<tag>",
        "metricsServer": "registry.k8s.io/metrics-server/metrics-server:<tag>",
        "istio": "docker.io/istio/pilot:<tag>"
      },
      "kubernetesVersions": [
        {
          "version": "v1.31.0",
          "label": "v1.31.0 (Latest Default)",
          "tag": "default",
          "isDefault": true,
          "notes": "Default Kubernetes GA release with latest upstream APIs"
        },
        {
          "version": "v1.30.4",
          "label": "v1.30.4 (Enterprise LTS)",
          "tag": "lts",
          "isDefault": false,
          "notes": "Enterprise hardened Kubernetes LTS release"
        },
        {
          "version": "v1.29.8",
          "label": "v1.29.8 (Maintenance)",
          "tag": "deprecated",
          "isDefault": false,
