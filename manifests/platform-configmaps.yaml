      "coreDNSVersions": [
        {
          "version": "v1.11.3",
          "label": "v1.11.3 (Default DNS)",
          "tag": "default",
          "isDefault": true,
          "notes": "Internal cluster service discovery and resolution"
        }
      ],
      "metricsServerVersions": [
        {
          "version": "v0.7.2",
          "label": "v0.7.2 (Default HPA Telemetry)",
          "tag": "default",
          "isDefault": true,
          "notes": "In-cluster resource metrics pipeline for autoscaling"
        }
      ],
      "istioVersions": [
        {
          "version": "1.24.2",
          "label": "1.24.2 (Production Gateway)",
          "tag": "default",
          "isDefault": true,
