# Keycloak Custom Resource Definition (Keycloak Operator)
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: example-keycloak
  namespace: default
spec:
  instances: 1
  image: local-keycloak:26.1.3
  hostname:
    hostname: keycloak.local
  http:
    tlsSecret: keycloak-tls-secret
  db:
    vendor: postgres
    host: postgres-service.default.svc.cluster.local
    database: keycloak
    usernameSecret:
      name: keycloak-db-secret
      key: username
    passwordSecret:
      name: keycloak-db-secret
      key: password
  unsupported:
    podTemplate:
      spec:
        containers:
        - name: keycloak
          imagePullPolicy: IfNotPresent
