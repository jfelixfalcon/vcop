# Cert-Manager Root CA, ClusterIssuer, and Service Certificates
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: local-dev-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: "Local Development Root CA"
  secretName: local-dev-ca-keypair
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: local-ca-issuer
spec:
  ca:
    secretName: local-dev-ca-keypair
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gateway-tls-cert
  namespace: envoy-gateway-system
spec:
  secretName: gateway-tls-cert
  issuerRef:
    name: local-ca-issuer
    kind: ClusterIssuer
  dnsNames:
  - "vcop.local"
  - "keycloak.local"
  - "*.local"
  - "localhost"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-tls-cert
  namespace: default
spec:
  secretName: keycloak-tls-secret
  issuerRef:
    name: local-ca-issuer
    kind: ClusterIssuer
  dnsNames:
  - "keycloak.local"
  - "example-keycloak-service.default.svc.cluster.local"
  - "example-keycloak-service.default.svc"
  - "example-keycloak-service"
  - "localhost"
