apiVersion: v1
kind: ConfigMap
metadata:
  name: vcop-registry-config
  namespace: vcop-system
  labels:
    app.kubernetes.io/name: vcop-registry
    app.kubernetes.io/part-of: vcop
data:
  config.yml: |
    version: 0.1
    log:
      level: info
      fields:
        service: registry
    storage:
      cache:
        blobdescriptor: inmemory
      filesystem:
        rootdirectory: /var/lib/registry
      delete:
        enabled: true
    http:
      addr: :5000
      headers:
        X-Content-Type-Options: [nosniff]
        Access-Control-Allow-Origin: ['*']
        Access-Control-Allow-Methods: ['HEAD', 'GET', 'OPTIONS', 'DELETE']
        Access-Control-Allow-Headers: ['Authorization', 'Accept', 'Cache-Control']
        Access-Control-Expose-Headers: ['Docker-Content-Digest']
    health:
      storagedriver:
        enabled: true
        interval: 10s
        threshold: 3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vcop-registry-data
  namespace: vcop-system
  labels:
    app.kubernetes.io/name: vcop-registry
    app.kubernetes.io/part-of: vcop
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vcop-registry
  namespace: vcop-system
  labels:
    app.kubernetes.io/name: vcop-registry
    app.kubernetes.io/part-of: vcop
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vcop-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vcop-registry
        app.kubernetes.io/part-of: vcop
    spec:
      containers:
        - name: registry
          image: docker.io/library/registry:2.8.3
          imagePullPolicy: IfNotPresent
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          ports:
            - name: registry
              containerPort: 5000
          livenessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: registry-data
              mountPath: /var/lib/registry
            - name: registry-config
              mountPath: /etc/docker/registry/config.yml
              subPath: config.yml
      volumes:
        - name: registry-data
          persistentVolumeClaim:
            claimName: vcop-registry-data
        - name: registry-config
          configMap:
            name: vcop-registry-config
---
apiVersion: v1
kind: Service
metadata:
  name: vcop-registry
  namespace: vcop-system
  labels:
    app.kubernetes.io/name: vcop-registry
    app.kubernetes.io/part-of: vcop
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vcop-registry
  ports:
    - name: registry
      port: 5000
      targetPort: 5000
