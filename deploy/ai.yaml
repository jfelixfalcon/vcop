apiVersion: apps/v1
kind: Deployment
metadata:
  name: vcop-ai
  namespace: vcop-system
  labels:
    app.kubernetes.io/name: vcop-ai
    app.kubernetes.io/component: inference-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vcop-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vcop-ai
    spec:
      containers:
        - name: gemma
          image: vops/vc-ai:v1.4.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: HOST
              value: "0.0.0.0"
            - name: MODEL_PATH
              value: "/models/gemma-3-1b-it-Q4_K_M.gguf"
            - name: N_GPU_LAYERS
              value: "99"
            - name: CTX_SIZE
              value: "4096"
            - name: THREADS
              value: "8"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "all"
          securityContext:
            privileged: true
          volumeMounts:
            - mountPath: /dev
              name: host-dev
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 4000m
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8080
            initialDelaySeconds: 4
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/models
              port: 8080
            initialDelaySeconds: 6
            periodSeconds: 15
      volumes:
        - name: host-dev
          hostPath:
            path: /dev
---
apiVersion: v1
kind: Service
metadata:
  name: vcop-ai
  namespace: vcop-system
  labels:
    app.kubernetes.io/name: vcop-ai
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vcop-ai
  ports:
    - name: http
      port: 8080
      targetPort: 8080
