apiVersion: apps/v1
kind: Deployment
metadata:
  name: vcop-ui
  namespace: vcop-system
  labels:
    app.kubernetes.io/name: vcop-ui
    app.kubernetes.io/component: dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vcop-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vcop-ui
    spec:
      serviceAccountName: vcop-ui
      containers:
        - name: ui
          image: vops/vc-operations-center:v1.4.1
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "4321"
            - name: NODE_ENV
              value: "production"
            - name: ADMIN_USERNAME
              value: "admin"
            - name: ADMIN_PASSWORD
              value: "vcop-breakglass-admin"
            - name: METRICS_DB_HOST
              value: "vcop-metrics-db.vcop-system.svc"
            - name: METRICS_DB_PORT
              value: "5432"
            - name: METRICS_DB_NAME
              value: "vcop_metrics"
            - name: METRICS_DB_USER
              value: "vcop"
            - name: METRICS_DB_PASSWORD
              value: "vcop-metrics-db-pass-2026"
            - name: AI_SERVICE_URL
              value: "http://vcop-ai.vcop-system.svc:8080"
            - name: DEBUG
              value: "true"
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
            - name: OIDC_ENABLED
              value: "true"
            - name: OIDC_ISSUER_URL
              value: "https://keycloak.example.com:8443/realms/master"
            - name: OIDC_USERINFO_URL
              value: "" # Optional override; auto-discovered from issuerUrl if empty
            - name: OIDC_CLIENT_ID
              value: "dso"
            - name: OIDC_CLIENT_SECRET
              value: "8b71c15a8f5c4cf1934b951624ff85f3"
            - name: OIDC_SCOPES
              value: "openid email profile"
            - name: OIDC_GROUPS_CLAIM
              value: "groups"
            - name: OIDC_ADMIN_EMAILS
              value: "admin@vops.local,admin@example.com,dso@local"
            - name: OIDC_ADMIN_GROUPS
              value: "admins,vcluster-admins,platform-ops,default-roles-master"
          ports:
            - name: http
              containerPort: 4321
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4321
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4321
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vcop-ui
  namespace: vcop-system
  labels:
    app.kubernetes.io/name: vcop-ui
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vcop-ui
  ports:
    - name: http
      port: 80
      targetPort: 4321
