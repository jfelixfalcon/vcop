apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vc-operator-manager-role
rules:
  # VirtualCluster Custom Resources
  - apiGroups:
      - vops.gitops.io
    resources:
      - virtualclusters
      - virtualclusters/status
      - virtualclusters/finalizers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Apps resources (StatefulSets for HA etcd, Deployments for syncer)
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Core resources (Services, ConfigMaps, Secrets, PVCs, Pods, Namespaces, Nodes)
  - apiGroups:
      - ""
    resources:
      - services
      - endpoints
      - configmaps
      - secrets
      - persistentvolumeclaims
      - pods
      - namespaces
      - resourcequotas
      - limitranges
      - nodes
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Leader Election Leases
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Metrics API
  - apiGroups:
      - metrics.k8s.io
    resources:
      - pods
      - nodes
    verbs:
      - get
      - list
      - watch
  # Batch resources (Jobs & CronJobs for etcd Disaster Recovery backups)
  - apiGroups:
      - batch
    resources:
      - cronjobs
      - jobs
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Events
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  # cert-manager.io resources (Certificates, ClusterIssuers, Issuers)
  - apiGroups:
      - cert-manager.io
    resources:
      - clusterissuers
      - issuers
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - cert-manager.io
    resources:
      - certificates
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Istio networking resources (Gateways, VirtualServices, DestinationRules)
  - apiGroups:
      - networking.istio.io
    resources:
      - gateways
      - virtualservices
      - destinationrules
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Kubernetes Gateway API resources
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gatewayclasses
      - gateways
      - httproutes
      - referencegrants
      - tlsroutes
      - tcproutes
      - grpcroutes
      - backendtlspolicies
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # CRD discovery
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
---
