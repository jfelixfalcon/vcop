apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vc-operator-manager-role
rules:
  # VirtualCluster Custom Resources
  - apiGroups:
      - vops.gitops.io
    resources:
      - virtualclusters
      - virtualclusters/status
      - virtualclusters/finalizers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Apps resources (StatefulSets for HA etcd, Deployments for syncer)
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Core resources (Services, ConfigMaps, Secrets, PVCs, Pods, Namespaces)
  - apiGroups:
      - ""
    resources:
      - services
      - endpoints
      - configmaps
      - secrets
      - persistentvolumeclaims
      - pods
      - namespaces
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Metrics API
  - apiGroups:
      - metrics.k8s.io
    resources:
      - pods
      - nodes
    verbs:
      - get
      - list
      - watch
  # Events
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vcop-ui-role
rules:
  - apiGroups:
      - vops.gitops.io
    resources:
      - virtualclusters
      - virtualclusters/status
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - secrets
      - pods
      - services
      - namespaces
    verbs:
      - create
      - get
      - list
      - watch
  - apiGroups:
      - metrics.k8s.io
    resources:
      - pods
      - nodes
    verbs:
      - get
      - list
