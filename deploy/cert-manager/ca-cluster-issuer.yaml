apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vcluster-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: "vCluster Operator Root CA"
  secretName: vcluster-ca-keypair
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vcluster-ca-issuer
spec:
  ca:
    secretName: vcluster-ca-keypair
