apiVersion: v1
kind: ConfigMap
metadata:
  name: vcluster-preset-dev-sandbox
  namespace: vcop-system
  labels:
    vops.gitops.io/template: "true"
    vops.gitops.io/preset: "dev-sandbox"
data:
  description: "Lightweight sandbox for ephemeral pull requests and developer prototyping (2 vCPU / 4GB RAM)"
  vcluster.yaml: |
    controlPlane:
      distro:
        k8s:
          enabled: true
          version: "v1.31.0"
          image: "registry.k8s.io/kube-apiserver:v1.31.0"
          controllerManager:
            image: "registry.k8s.io/kube-controller-manager:v1.31.0"
      backingStore:
        etcd:
          deploy:
            statefulSet:
              highAvailability:
                replicas: 1
              persistence:
                volumeClaim:
                  size: "5Gi"
              resources:
                requests:
                  cpu: "500m"
                  memory: "1Gi"
                limits:
                  cpu: "2000m"
                  memory: "4Gi"
      coreDNS:
        enabled: true
    integrations:
      metricsServer:
        enabled: true
    sync:
      toHost:
        pods:
          enabled: true
        services:
          enabled: true
        ingresses:
          enabled: true
    policies:
      autoSleep:
        enabled: true
