apiVersion: v1
kind: ConfigMap
metadata:
  name: vcluster-preset-gpu-isolated
  namespace: vcop-system
  labels:
    vops.gitops.io/template: "true"
    vops.gitops.io/preset: "gpu-isolated"
data:
  description: "GPU-accelerated virtual cluster with dedicated NVMe backing store and high-throughput node synchronization"
  vcluster.yaml: |
    controlPlane:
      distro:
        k8s:
          enabled: true
          version: "v1.31.0"
          image: "registry.k8s.io/kube-apiserver:v1.31.0"
          controllerManager:
            image: "registry.k8s.io/kube-controller-manager:v1.31.0"
      backingStore:
        etcd:
          deploy:
            statefulSet:
              highAvailability:
                replicas: 3
              persistence:
                volumeClaim:
                  size: "50Gi"
              resources:
                requests:
                  cpu: "2000m"
                  memory: "8Gi"
                limits:
                  cpu: "8000m"
                  memory: "32Gi"
      coreDNS:
        enabled: true
    integrations:
      metricsServer:
        enabled: true
    sync:
      toHost:
        pods:
          enabled: true
        services:
          enabled: true
        ingresses:
          enabled: true
      fromHost:
        nodes:
          enabled: true
          selector:
            labels:
              accelerator: "nvidia-tesla"
