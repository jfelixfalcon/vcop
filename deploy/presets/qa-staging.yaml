apiVersion: v1
kind: ConfigMap
metadata:
  name: vcluster-preset-qa-staging
  namespace: vcop-system
  labels:
    vops.gitops.io/template: "true"
    vops.gitops.io/preset: "qa-staging"
data:
  description: "High-availability staging environment for team integration testing (4 vCPU / 8GB RAM, 3-node etcd)"
  vcluster.yaml: |
    controlPlane:
      distro:
        k8s:
          enabled: true
          version: "v1.31.0"
          image: "registry.k8s.io/kube-apiserver:v1.31.0"
          controllerManager:
            image: "registry.k8s.io/kube-controller-manager:v1.31.0"
      backingStore:
        etcd:
          deploy:
            statefulSet:
              highAvailability:
                replicas: 3
              persistence:
                volumeClaim:
                  size: "10Gi"
              resources:
                requests:
                  cpu: "1000m"
                  memory: "2Gi"
                limits:
                  cpu: "4000m"
                  memory: "8Gi"
      coreDNS:
        enabled: true
    integrations:
      metricsServer:
        enabled: true
    sync:
      toHost:
        pods:
          enabled: true
        services:
          enabled: true
        ingresses:
          enabled: true
