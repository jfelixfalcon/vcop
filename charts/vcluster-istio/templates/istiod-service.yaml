{{- if .Values.istiod.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: istiod
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "vcluster-istio.labels" . | nindent 4 }}
    app: istiod
    istio: pilot
spec:
  ports:
    - name: grpc-xds
      port: 15010
      protocol: TCP
      targetPort: 15010
    - name: https-xds
      port: 15012
      protocol: TCP
      targetPort: 15012
    - name: https-dns
      port: 15014
      protocol: TCP
      targetPort: 15014
  selector:
    app: istiod
{{- end }}
