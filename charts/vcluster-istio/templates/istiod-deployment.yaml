{{- if .Values.istiod.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: istiod
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "vcluster-istio.labels" . | nindent 4 }}
    app: istiod
    istio: pilot
spec:
  replicas: {{ .Values.istiod.replicaCount }}
  selector:
    matchLabels:
      app: istiod
  template:
    metadata:
      labels:
        app: istiod
        istio: pilot
    spec:
      serviceAccountName: istiod
      containers:
        - name: discovery
          image: "{{ .Values.istiod.image.repository }}:{{ .Values.istiod.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - "discovery"
            - "--monitoringAddr=:15014"
            - "--log_output_level=default:info"
            - "--domain=cluster.local"
            - "--keepaliveMaxServerConnectionAge=30m"
          ports:
            - containerPort: 8080
              protocol: TCP
            - containerPort: 15010
              protocol: TCP
            - containerPort: 15012
              protocol: TCP
            - containerPort: 15014
              protocol: TCP
          env:
            - name: REVISION
              value: "default"
            - name: PILOT_ENABLE_STATUS
              value: "true"
            - name: PILOT_ENABLE_INBOUND_PASSTHROUGH
              value: "1"
            - name: PILOT_ENABLE_GATEWAY_API
              value: "false"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.istiod.resources | nindent 12 }}
{{- end }}
