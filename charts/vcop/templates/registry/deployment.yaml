{{- if .Values.registry.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vcop.fullname" . }}-registry
  labels:
    {{- include "vcop.labels" . | nindent 4 }}
    app.kubernetes.io/component: oci-registry
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "vcop.registry.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vcop.registry.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: registry
          image: "{{ .Values.registry.image.repository }}:{{ .Values.registry.image.tag }}"
          imagePullPolicy: {{ .Values.registry.image.pullPolicy }}
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          ports:
            - name: registry
              containerPort: {{ .Values.registry.service.port | default 5000 }}
          livenessProbe:
            httpGet:
              path: /v2/
              port: {{ .Values.registry.service.port | default 5000 }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /v2/
              port: {{ .Values.registry.service.port | default 5000 }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.registry.resources | nindent 12 }}
          volumeMounts:
            - name: registry-data
              mountPath: /var/lib/registry
            - name: registry-config
              mountPath: /etc/docker/registry/config.yml
              subPath: config.yml
      volumes:
        - name: registry-data
          {{- if .Values.registry.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "vcop.fullname" . }}-registry-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: registry-config
          configMap:
            name: {{ include "vcop.fullname" . }}-registry-config
{{- end }}
