{{- if and .Values.registry.enabled .Values.registry.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "vcop.fullname" . }}-registry-data
  labels:
    {{- include "vcop.labels" . | nindent 4 }}
    app.kubernetes.io/component: oci-registry
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.registry.persistence.storageClass }}
  storageClassName: {{ .Values.registry.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.registry.persistence.size | default "20Gi" }}
{{- end }}
