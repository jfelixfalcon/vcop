{{- if and .Values.operator.enabled .Values.operator.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vcop.fullname" . }}-operator-role
  labels:
    {{- include "vcop.labels" . | nindent 4 }}
rules:
  # VirtualCluster CRD
  - apiGroups:
      - vops.gitops.io
    resources:
      - virtualclusters
      - virtualclusters/status
      - virtualclusters/finalizers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Apps resources
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Core resources
  - apiGroups:
      - ""
    resources:
      - services
      - endpoints
      - configmaps
      - secrets
      - persistentvolumeclaims
      - pods
      - namespaces
      - serviceaccounts
      - resourcequotas
      - limitranges
      - nodes
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # RBAC management for managed vClusters
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Metrics
  - apiGroups:
      - metrics.k8s.io
    resources:
      - pods
      - nodes
    verbs:
      - get
      - list
      - watch
  # Events
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  # Coordination for leader election
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "vcop.fullname" . }}-operator-rolebinding
  labels:
    {{- include "vcop.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "vcop.fullname" . }}-operator-role
subjects:
  - kind: ServiceAccount
    name: {{ include "vcop.operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "vcop.fullname" . }}-operator-admin
  labels:
    {{- include "vcop.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: {{ include "vcop.operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

