{{- if .Values.ui.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vcop.fullname" . }}-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vcop.labels" . | nindent 4 }}
    {{- include "vcop.ui.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicaCount }}
  selector:
    matchLabels:
      {{- include "vcop.ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vcop.labels" . | nindent 8 }}
        {{- include "vcop.ui.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "vcop.ui.serviceAccountName" . }}
      containers:
        - name: ui
          image: "{{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}/{{ end }}{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ default .Values.global.imagePullPolicy .Values.ui.image.pullPolicy }}
          env:
            {{- range $key, $value := .Values.ui.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.ui.auth }}
            {{- if .Values.ui.auth.sessionSecret }}
            - name: SESSION_SECRET
              value: {{ .Values.ui.auth.sessionSecret | quote }}
            {{- end }}
            {{- if .Values.ui.auth.breakglass }}
            - name: ADMIN_USERNAME
              value: {{ default "admin" .Values.ui.auth.breakglass.adminUsername | quote }}
            - name: ADMIN_PASSWORD
              value: {{ default "vcop-breakglass-admin" .Values.ui.auth.breakglass.adminPassword | quote }}
            {{- end }}
            {{- if and .Values.ui.auth.oidc .Values.ui.auth.oidc.enabled }}
            - name: OIDC_ENABLED
              value: "true"
            - name: OIDC_ISSUER_URL
              value: {{ .Values.ui.auth.oidc.issuerUrl | quote }}
            {{- if .Values.ui.auth.oidc.userInfoUrl }}
            - name: OIDC_USERINFO_URL
              value: {{ .Values.ui.auth.oidc.userInfoUrl | quote }}
            {{- end }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.ui.auth.oidc.clientId | quote }}
            - name: OIDC_CLIENT_SECRET
              value: {{ .Values.ui.auth.oidc.clientSecret | quote }}
            - name: OIDC_REDIRECT_URI
              value: {{ default "" .Values.ui.auth.oidc.redirectUri | quote }}
            - name: OIDC_SCOPES
              value: {{ default "openid email profile" .Values.ui.auth.oidc.scopes | quote }}
            - name: OIDC_GROUPS_CLAIM
              value: {{ default "groups" .Values.ui.auth.oidc.groupsClaim | quote }}
            - name: OIDC_PROVIDER_NAME
              value: {{ default "Single Sign-On (OIDC)" .Values.ui.auth.oidc.providerName | quote }}
            - name: OIDC_ADMIN_GROUPS
              value: {{ default "admins,vcluster-admins,platform-ops" .Values.ui.auth.oidc.adminGroups | quote }}
            - name: OIDC_ADMIN_EMAILS
              value: {{ default "admin@vops.local" .Values.ui.auth.oidc.adminEmails | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: 4321
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/metrics
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.ui.securityContext | nindent 12 }}
      {{- with .Values.ui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
