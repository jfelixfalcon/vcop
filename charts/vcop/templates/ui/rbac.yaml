{{- if and .Values.ui.enabled .Values.ui.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vcop.fullname" . }}-ui-role
  labels:
    {{- include "vcop.labels" . | nindent 4 }}
rules:
  # VirtualCluster CRD
  - apiGroups:
      - vops.gitops.io
    resources:
      - virtualclusters
      - virtualclusters/status
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Workload resources for lifecycle operations & restarts
  - apiGroups:
      - apps
    resources:
      - deployments
      - daemonsets
      - statefulsets
      - replicasets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Core resources for reading secrets (kubeconfigs), configmaps, pods, services, nodes, PVCs
  - apiGroups:
      - ""
    resources:
      - secrets
      - configmaps
      - pods
      - services
      - nodes
      - persistentvolumeclaims
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - batch
    resources:
      - cronjobs
      - jobs
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - create
      - get
      - list
      - watch
  # Metrics API
  - apiGroups:
      - metrics.k8s.io
    resources:
      - pods
      - nodes
    verbs:
      - get
      - list
  # cert-manager resources for TLS certificate and issuer discovery
  - apiGroups:
      - cert-manager.io
    resources:
      - clusterissuers
      - issuers
      - certificates
    verbs:
      - get
      - list
      - watch
  # Istio networking resources
  - apiGroups:
      - networking.istio.io
    resources:
      - gateways
      - virtualservices
    verbs:
      - get
      - list
      - watch
  # Kubernetes Gateway API resources
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gatewayclasses
      - gateways
      - httproutes
      - referencegrants
      - tlsroutes
      - tcproutes
      - grpcroutes
    verbs:
      - get
      - list
      - watch
  # CRD discovery
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
  # StorageClass discovery for persistent storage & database drives
  - apiGroups:
      - storage.k8s.io
    resources:
      - storageclasses
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "vcop.fullname" . }}-ui-rolebinding
  labels:
    {{- include "vcop.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "vcop.fullname" . }}-ui-role
subjects:
  - kind: ServiceAccount
    name: {{ include "vcop.ui.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
