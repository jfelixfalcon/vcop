{{- if .Values.ai.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vcop.fullname" . }}-ai
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vcop.labels" . | nindent 4 }}
    app.kubernetes.io/component: inference-engine
spec:
  type: {{ .Values.ai.service.type | default "ClusterIP" }}
  selector:
    {{- include "vcop.ai.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ai.service.port | default 8080 }}
      targetPort: 8080
      protocol: TCP
{{- end }}
