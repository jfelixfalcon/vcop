# Default values for vcop Helm chart.
# This is a YAML-formatted file.

# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []

# Operator settings
operator:
  enabled: true
  replicaCount: 1

  image:
    repository: vops/vc-operator
    tag: v0.37.0
    pullPolicy: IfNotPresent

  serviceAccount:
    create: true
    name: ""
    annotations: {}

  rbac:
    create: true

  leaderElect: true

  metrics:
    bindAddress: ":8080"
    service:
      enabled: true
      type: ClusterIP
      port: 8080

  healthProbe:
    bindAddress: ":8081"

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532

  nodeSelector: {}
  tolerations: []
  affinity: {}

# Operations Center UI settings
ui:
  enabled: true
  replicaCount: 1

  image:
    repository: vops/vc-operations-center
    tag: v0.37.0
    pullPolicy: IfNotPresent

  serviceAccount:
    create: true
    name: ""
    annotations: {}

  rbac:
    create: true

  env:
    HOST: "0.0.0.0"
    PORT: "4321"
    NODE_ENV: "production"

  service:
    type: ClusterIP
    port: 80
    targetPort: 4321
    nodePort: null

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: vcop.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 1000

  nodeSelector: {}
  tolerations: []
  affinity: {}

# Standard VirtualCluster Sizing Presets (ConfigMaps)
presets:
  enabled: true
  devSandbox:
    enabled: true
  qaStaging:
    enabled: true
  gpuIsolated:
    enabled: true
