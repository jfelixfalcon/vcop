# Default values for vcop Helm chart.
# This is a YAML-formatted file.

# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []

# Operator settings
operator:
  enabled: true
  replicaCount: 1

  image:
    repository: vops/vc-operator
    tag: v1.4.1
    pullPolicy: IfNotPresent

  serviceAccount:
    create: true
    name: ""
    annotations: {}

  rbac:
    create: true

  leaderElect: true

  metrics:
    bindAddress: ":8080"
    service:
      enabled: true
      type: ClusterIP
      port: 8080

  healthProbe:
    bindAddress: ":8081"

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532

  nodeSelector: {}
  tolerations: []
  affinity: {}

# Operations Center UI settings
ui:
  enabled: true
  replicaCount: 1

  image:
    repository: vops/vc-operations-center
    tag: v1.4.1
    pullPolicy: IfNotPresent

  serviceAccount:
    create: true
    name: ""
    annotations: {}

  rbac:
    create: true

  env:
    HOST: "0.0.0.0"
    PORT: "4321"
    NODE_ENV: "production"
    AI_SERVICE_URL: "http://vcop-ai:8080"
    METRICS_DB_HOST: "vcop-metrics-db"
    METRICS_DB_PORT: "5432"
    METRICS_DB_NAME: "vcop_metrics"
    METRICS_DB_USER: "vcop"
    METRICS_DB_PASSWORD: "vcop-metrics-db-pass-2026"

  # Authentication & RBAC Governance
  auth:
    enabled: true
    sessionSecret: "" # Set to custom HMAC secret; auto-generated if empty
    breakglass:
      adminUsername: "admin"
      adminPassword: "vcop-breakglass-admin"
    oidc:
      enabled: false
      issuerUrl: "" # e.g. https://accounts.google.com or https://auth.corp.com/realms/cloud
      clientId: ""
      clientSecret: ""
      redirectUri: ""
      scopes: "openid email profile groups"
      providerName: "Single Sign-On (OIDC)"
      adminGroups: "admins,vcluster-admins,platform-ops"
      adminEmails: "admin@vops.local"

  service:
    type: ClusterIP
    port: 80
    targetPort: 4321
    nodePort: null

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: vcop.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 1000

  nodeSelector: {}
  tolerations: []
  affinity: {}

# Standard VirtualCluster Sizing Presets (ConfigMaps)
presets:
  enabled: true
  devSandbox:
    enabled: true
  qaStaging:
    enabled: true
  gpuIsolated:
    enabled: true

# Historical Telemetry & Workload Metrics Database (PostgreSQL)
metricsDb:
  enabled: true
  image:
    repository: docker.io/library/postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    storageClass: "standard"
    size: 5Gi
  credentials:
    dbName: "vcop_metrics"
    user: "vcop"
    password: "vcop-metrics-db-pass-2026"

# Disaster Recovery & Automated etcd Backup Engine
disasterRecovery:
  enabled: true
  runnerImage:
    repository: vops/etcd-dr-runner
    tag: v1.4.1
    pullPolicy: IfNotPresent
  defaultSchedule: "daily"
  defaultRetentionCount: 7
  defaultStorageSize: "10Gi"

# Offline Embedded Cluster Assistant (Gemma 3 1B IT)
ai:
  enabled: true
  replicaCount: 1
  image:
    repository: vops/vc-ai
    tag: v1.4.1
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  model:
    path: "/models/gemma-3-1b-it-Q4_K_M.gguf"
    gpuLayers: 99
    contextSize: 4096
    threads: 8
  gpu:
    enabled: true
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 4000m
      memory: 4Gi
  securityContext:
    privileged: true
  nodeSelector: {}
  tolerations: []
  affinity: {}



